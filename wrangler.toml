name = "gc-scheduler"
main = "src/index.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 1分おきに自動実行(予定時刻を過ぎた枠があれば出品)
[triggers]
crons = ["* * * * *"]

# 保存領域(二重出品を防ぐため、常に最新の値を返すDurable Objectを使います)
[[durable_objects.bindings]]
name = "GC_STORE"
class_name = "GcStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GcStore"]

# 以前の保存領域。中身を自動で引っ越すために残しています。
[[kv_namespaces]]
binding = "GC_KV"
id = "152d539fffa34fc98d1d74b36851dc5f"
